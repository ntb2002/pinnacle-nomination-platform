name: CI

# The authoritative, server-side gate. Runs on every PR + push to main regardless of
# which machine/agent produced the commits, so it can't be bypassed like a local hook.
# Make `main` require this check via branch protection (see docs/git-workflow.md).
#
# Replace the placeholder job with your stack. Examples below.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --- replace with your stack's install / lint / test steps ---
      - run: echo "Add lint + test commands here."

